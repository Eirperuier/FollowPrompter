name: FollowPrompter
options:
  bundleIdPrefix: com.reiureprie
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FollowPrompter:
    type: application
    platform: iOS
    sources:
      - path: FollowPrompter
        excludes: ["Support/Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reiureprie.followprompter
        INFOPLIST_FILE: FollowPrompter/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 随声提词
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 随声提词需要使用麦克风听你朗读，让提词内容跟着你的语速滚动。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 随声提词需要语音识别来判断你读到了稿子的哪个位置。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [FollowPrompterTests]
  FollowPrompterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FollowPrompterTests]
    dependencies:
      - target: FollowPrompter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.reiureprie.followprompter.tests
